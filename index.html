<!DOCTYPE html>
<html>
<head>
    <title>My Timeline Test</title>
</head>
<body>
    <h1>GitHub Pages is Working!</h1>
    <p>If you can see this, your GitHub Pages is working correctly.</p>
    <p>Now we can add the timeline.</p>
    
    <div id="timeline-embed" style="width: 100%; height: 600px;"></div>

    <!-- Load TimelineJS from CDN for now -->
    <link rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
    <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
    
    <script>
        var timelineData = {
            "title": {
                "text": {
                    "headline": "Test Timeline",
                    "text": "Testing GitHub Pages"
                }
            },
            "events": [
                {
                    "start_date": { "year": "2020" },
                    "text": {
                        "headline": "Test Event",
                        "text": "This is a test event"
                    }
                }
            ]
        };
        
        window.timeline = new TL.Timeline('timeline-embed', timelineData);
    </script>
</body>
